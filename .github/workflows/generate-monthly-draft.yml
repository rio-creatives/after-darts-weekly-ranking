name: Generate Monthly Ranking Draft

on:
  schedule:
    # Monthly SNS email: 9:00 AM Philippine time on the 1st.
    - cron: "0 9 1 * *"
      timezone: "Asia/Manila"

  workflow_dispatch:
    inputs:
      target_month:
        description: "Target month in YYYY-MM. Leave blank to use the previous month."
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve target month and schedule
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MONTH: ${{ github.event.inputs.target_month }}
        run: |
          set -euo pipefail

          TODAY_PHT=$(TZ=Asia/Manila date +%F)
          DAY_PHT=$(TZ=Asia/Manila date +%d)
          CURRENT_MONTH_START=$(TZ=Asia/Manila date +%Y-%m-01)
          PREVIOUS_MONTH=$(TZ=Asia/Manila date \
            -d "${CURRENT_MONTH_START} -1 month" \
            +%Y-%m)

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TARGET_MONTH="${INPUT_MONTH:-$PREVIOUS_MONTH}"
            SHOULD_RUN=true
          elif [ "${DAY_PHT}" = "01" ]; then
            TARGET_MONTH="$PREVIOUS_MONTH"
            SHOULD_RUN=true
          else
            TARGET_MONTH="$PREVIOUS_MONTH"
            SHOULD_RUN=false
          fi

          if [[ ! "$TARGET_MONTH" =~ ^[0-9]{4}-[0-9]{2}$ ]]; then
            echo "Invalid target month: $TARGET_MONTH"
            exit 1
          fi

          echo "Philippine date: $TODAY_PHT"
          echo "Resolved target month: $TARGET_MONTH"
          echo "Generate draft: $SHOULD_RUN"
          echo "month=$TARGET_MONTH" >> "$GITHUB_OUTPUT"
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.target.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.target.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate monthly draft
        if: steps.target.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_MONTH: ${{ steps.target.outputs.month }}
        run: node generate-monthly-draft.mjs

      - name: Verify Monthly Champion caption formatting
        if: steps.target.outputs.should_run == 'true'
        run: node --test monthly-champion-post.test.mjs

      - name: Upload generated draft
        if: steps.target.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: monthly-ranking-draft-${{ steps.target.outputs.month }}
          path: |
            generated/monthly-draft-${{ steps.target.outputs.month }}.md
            generated/monthly-draft-${{ steps.target.outputs.month }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Create or update draft issue
        if: steps.target.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_MONTH: ${{ steps.target.outputs.month }}
        run: |
          set -euo pipefail

          BODY_FILE="generated/monthly-draft-${TARGET_MONTH}.md"

          if [ ! -f "$BODY_FILE" ]; then
            echo "Generated Markdown file was not found:"
            echo "$BODY_FILE"
            exit 1
          fi

          export TITLE="[Draft] AFTER Monthly Ranking — ${TARGET_MONTH}"

          {
            echo "<!-- after-monthly-ranking-draft:${TARGET_MONTH} -->"
            echo "@${GITHUB_REPOSITORY_OWNER}"
            echo
            echo "**Review required:** This draft was generated automatically."
            echo "Please confirm the player names, scores, wording, and prize information before posting."
            echo
            cat "$BODY_FILE"
          } > issue-body.md

          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --limit 1000 \
            --json number,title \
            > existing-issues.json

          ISSUE_NUMBER=$(node <<'NODE'
          const fs = require("fs");

          const issues = JSON.parse(
            fs.readFileSync("existing-issues.json", "utf8")
          );

          const issue = issues.find(
            (item) => item.title === process.env.TITLE
          );

          if (issue) {
            process.stdout.write(String(issue.number));
          }
          NODE
          )

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file issue-body.md

            echo "Updated existing Issue #${ISSUE_NUMBER}"
          else
            ISSUE_URL=$(gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body-file issue-body.md)

            echo "Created Issue:"
            echo "$ISSUE_URL"
          fi

      - name: Report non-scheduled day
        if: steps.target.outputs.should_run != 'true'
        run: |
          echo "No monthly ranking draft is scheduled for today."
