name: Test GitHub Models

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cat > request.json <<'JSON'
          {
            "model": "openai/gpt-4o-mini",
            "temperature": 0.2,
            "max_tokens": 120,
            "messages": [
              {
                "role": "system",
                "content": "Return one short plain-English sentence."
              },
              {
                "role": "user",
                "content": "Confirm that GitHub Models is working for the AFTER ranking automation."
              }
            ]
          }
          JSON

          status=$(curl -sS \
            -o response.json \
            -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Content-Type: application/json" \
            "https://models.github.ai/inference/chat/completions" \
            --data @request.json)

          if [ "$status" -ne 200 ]; then
            echo "GitHub Models request failed. HTTP status: $status"
            cat response.json
            exit 1
          fi

          node <<'NODE'
          const fs = require("fs");

          const response = JSON.parse(
            fs.readFileSync("response.json", "utf8")
          );

          const content =
            response.choices?.[0]?.message?.content?.trim();

          if (!content) {
            throw new Error(
              "GitHub Models returned no response content."
            );
          }

          console.log("GitHub Models connection successful.");
          console.log(content);
          NODE
