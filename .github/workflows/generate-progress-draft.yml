name: Generate Ranking Progress Draft

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Progress date in YYYY-MM-DD format (blank = today in PHT)"
        required: false
        default: ""
        type: string
      save_snapshot:
        description: "Save a comparison snapshot when the ranking data is from the target date"
        required: true
        default: false
        type: boolean
  schedule:
    # Run after AFTER closes at 5:00 AM, with time for ranking data to refresh.
    - cron: "13 7 * * *"
      timezone: "Asia/Manila"

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Determine target date and schedule
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TARGET_DATE: ${{ inputs.target_date }}
          MANUAL_SAVE_SNAPSHOT: ${{ inputs.save_snapshot }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const eventName = process.env.EVENT_NAME;
          const manualDate = (process.env.MANUAL_TARGET_DATE || "").trim();

          const parts = Object.fromEntries(
            new Intl.DateTimeFormat("en-CA", {
              timeZone: "Asia/Manila",
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
            })
              .formatToParts(new Date())
              .filter((part) => part.type !== "literal")
              .map((part) => [part.type, part.value]),
          );

          const todayInPht = `${parts.year}-${parts.month}-${parts.day}`;
          const targetDate = eventName === "workflow_dispatch"
            ? manualDate || todayInPht
            : todayInPht;

          const match = targetDate.match(/^(\d{4})-(\d{2})-(\d{2})$/);
          if (!match) {
            throw new Error("target_date must use YYYY-MM-DD format.");
          }

          const year = Number(match[1]);
          const month = Number(match[2]);
          const day = Number(match[3]);
          const parsed = new Date(Date.UTC(year, month - 1, day));

          if (
            parsed.getUTCFullYear() !== year ||
            parsed.getUTCMonth() !== month - 1 ||
            parsed.getUTCDate() !== day
          ) {
            throw new Error(`Invalid target_date: ${targetDate}`);
          }

          const lastDay = new Date(Date.UTC(year, month, 0)).getUTCDate();
          const finalChallengeDay = lastDay - 3;
          const isAugust2026 = year === 2026 && month === 8;
          const scheduledDays = isAugust2026
            ? [11, 18, 25]
            : [8, 15, 22, finalChallengeDay];
          const isManual = eventName === "workflow_dispatch";
          const shouldRun = isManual || scheduledDays.includes(day);
          const saveSnapshot = isManual
            ? process.env.MANUAL_SAVE_SNAPSHOT === "true"
            : true;

          const output = [
            `target_date=${targetDate}`,
            `should_run=${shouldRun}`,
            `save_snapshot=${saveSnapshot}`,
            `final_challenge_day=${finalChallengeDay}`,
          ].join("\n") + "\n";

          fs.appendFileSync(process.env.GITHUB_OUTPUT, output);

          console.log(`Event: ${eventName}`);
          console.log(`PHT target date: ${targetDate}`);
          console.log(`Scheduled days this month: ${scheduledDays.join(", ")}`);
          console.log(`Generate draft: ${shouldRun}`);
          console.log(`Save snapshot: ${saveSnapshot}`);
          NODE

      - name: Check out repository
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate ranking progress draft
        if: steps.schedule.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_DATE: ${{ steps.schedule.outputs.target_date }}
          SAVE_SNAPSHOT: ${{ steps.schedule.outputs.save_snapshot }}
        run: node generate-progress-draft.mjs

      - name: Upload generated draft
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ranking-progress-draft-${{ steps.schedule.outputs.target_date }}
          path: |
            generated/progress-draft-${{ steps.schedule.outputs.target_date }}.md
            generated/progress-draft-${{ steps.schedule.outputs.target_date }}.json
            data/progress-snapshots/${{ steps.schedule.outputs.target_date }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit ranking progress snapshot
        if: steps.schedule.outputs.should_run == 'true' && steps.schedule.outputs.save_snapshot == 'true'
        env:
          TARGET_DATE: ${{ steps.schedule.outputs.target_date }}
        run: |
          set -euo pipefail

          SNAPSHOT_FILE="data/progress-snapshots/${TARGET_DATE}.json"

          if [ ! -f "$SNAPSHOT_FILE" ]; then
            echo "Snapshot was not saved because the ranking data was not safe for the target date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SNAPSHOT_FILE"

          if git diff --cached --quiet; then
            echo "Snapshot is already up to date."
            exit 0
          fi

          git commit -m "Save ranking progress snapshot ${TARGET_DATE}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Create or update draft issue
        if: steps.schedule.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_DATE: ${{ steps.schedule.outputs.target_date }}
        run: |
          set -euo pipefail

          BODY_FILE="generated/progress-draft-${TARGET_DATE}.md"

          if [ ! -f "$BODY_FILE" ]; then
            echo "Generated Markdown file was not found:"
            echo "$BODY_FILE"
            exit 1
          fi

          export TITLE="[Progress Draft] AFTER Ranking — ${TARGET_DATE}"
          MARKER="<!-- after-ranking-progress-draft:${TARGET_DATE} -->"

          {
            echo "$MARKER"
            echo "@${GITHUB_REPOSITORY_OWNER}"
            echo
            echo "**Review required:** This draft was generated automatically."
            echo "Please confirm the player names, scores, data freshness, comparison facts, and wording before posting."
            echo
            cat "$BODY_FILE"
          } > issue-body.md

          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --limit 1000 \
            --json number,title,body \
            > existing-issues.json

          ISSUE_NUMBER=$(node <<'NODE'
          const fs = require("fs");

          const issues = JSON.parse(
            fs.readFileSync("existing-issues.json", "utf8")
          );

          const marker = `<!-- after-ranking-progress-draft:${process.env.TARGET_DATE} -->`;
          const issue = issues.find(
            (item) => item.title === process.env.TITLE || item.body?.includes(marker)
          );

          if (issue) {
            process.stdout.write(String(issue.number));
          }
          NODE
          )

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body-file issue-body.md

            echo "Updated existing Issue #${ISSUE_NUMBER}"
          else
            ISSUE_URL=$(gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body-file issue-body.md)

            echo "Created Issue:"
            echo "$ISSUE_URL"
          fi

      - name: Report non-scheduled day
        if: steps.schedule.outputs.should_run != 'true'
        env:
          TARGET_DATE: ${{ steps.schedule.outputs.target_date }}
        run: |
          echo "${TARGET_DATE} is not a progress-post date."
          echo "See the Determine target date and schedule step for this month's dates."
