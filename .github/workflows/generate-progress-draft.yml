name: Generate Ranking Progress Draft

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Progress date in YYYY-MM-DD format"
        required: true
        default: "2026-08-08"
        type: string
      save_snapshot:
        description: "Save a comparison snapshot when the ranking data is from the target date"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate ranking progress draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_DATE: ${{ inputs.target_date }}
          SAVE_SNAPSHOT: ${{ inputs.save_snapshot }}
        run: node generate-progress-draft.mjs

      - name: Upload generated draft
        uses: actions/upload-artifact@v4
        with:
          name: ranking-progress-draft-${{ inputs.target_date }}
          path: |
            generated/progress-draft-${{ inputs.target_date }}.md
            generated/progress-draft-${{ inputs.target_date }}.json
            data/progress-snapshots/${{ inputs.target_date }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit ranking progress snapshot
        if: ${{ inputs.save_snapshot }}
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          set -euo pipefail

          SNAPSHOT_FILE="data/progress-snapshots/${TARGET_DATE}.json"

          if [ ! -f "$SNAPSHOT_FILE" ]; then
            echo "Snapshot was not saved because the ranking data was not safe for the target date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SNAPSHOT_FILE"

          if git diff --cached --quiet; then
            echo "Snapshot is already up to date."
            exit 0
          fi

          git commit -m "Save ranking progress snapshot ${TARGET_DATE}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Create or update draft issue
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          set -euo pipefail

          BODY_FILE="generated/progress-draft-${TARGET_DATE}.md"

          if [ ! -f "$BODY_FILE" ]; then
            echo "Generated Markdown file was not found:"
            echo "$BODY_FILE"
            exit 1
          fi

          export TITLE="[Progress Draft] AFTER Ranking — ${TARGET_DATE}"
          MARKER="<!-- after-ranking-progress-draft:${TARGET_DATE} -->"

          {
            echo "$MARKER"
            echo "@${GITHUB_REPOSITORY_OWNER}"
            echo
            echo "**Review required:** This draft was generated automatically."
            echo "Please confirm the player names, scores, data freshness, comparison facts, and wording before posting."
            echo
            cat "$BODY_FILE"
          } > issue-body.md

          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --limit 1000 \
            --json number,title,body \
            > existing-issues.json

          ISSUE_NUMBER=$(node <<'NODE'
          const fs = require("fs");

          const issues = JSON.parse(
            fs.readFileSync("existing-issues.json", "utf8")
          );

          const marker = `<!-- after-ranking-progress-draft:${process.env.TARGET_DATE} -->`;
          const issue = issues.find(
            (item) => item.title === process.env.TITLE || item.body?.includes(marker)
          );

          if (issue) {
            process.stdout.write(String(issue.number));
          }
          NODE
          )

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body-file issue-body.md

            echo "Updated existing Issue #${ISSUE_NUMBER}"
          else
            ISSUE_URL=$(gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body-file issue-body.md)

            echo "Created Issue:"
            echo "$ISSUE_URL"
          fi
